description: Kaiheikeji Digital (开黑科技) is a Chinese mobile entertainment and esports social platform
  operating an online game "sparring"/companion marketplace, where players post demands (game, skill
  level, and price) and qualified players selectively take orders to play alongside clients. Backed by
  Qiming Venture Partners, which led a roughly $15M Series A+ round in 2018. The company operates a
  consumer-facing mobile app rather than a public developer API program; no public API, developer portal,
  or API documentation surface has been identified. This profile is maintained in the API Evangelist
  network as a company record surfaced from the Qiming portfolio.
